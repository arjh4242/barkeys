name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BarKeys.app
        run: ./build.sh

      - name: Build DMG installer
        run: ./make_dmg.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarKeys.app
          path: build/BarKeys.app

      - name: Upload DMG installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarKeys.dmg
          path: build/BarKeys.dmg
